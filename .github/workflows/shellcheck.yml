name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax check (sh -n)
        run: |
          for f in scripts/*.sh scripts/rcS.local.example; do
            sh -n "$f"
          done
      - name: ShellCheck (POSIX sh, warnings and errors)
        run: shellcheck --version && shellcheck -s sh -S warning scripts/*.sh scripts/rcS.local.example
